[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0.150"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "tls-rustls"] }
dotenvy = "0.15.7"
sqlx-sqlite = "0.9.0"
